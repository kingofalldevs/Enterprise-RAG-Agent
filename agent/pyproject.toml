[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.140.0",
    "httpx>=0.28.1",
    "mcp>=1.28.1",
    "openai>=2.48.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "sse-starlette>=3.4.6",
    "uvicorn>=0.51.0",
]

[tool.setuptools]
py-modules = ["main", "registry", "mcp_client", "remote_mcp_server", "tools"]
